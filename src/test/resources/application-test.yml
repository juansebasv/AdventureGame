# Perfil "test": base de datos H2 en memoria para que el contexto de Spring
# arranque sin necesidad de Docker ni PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:adventure;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database: H2
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

adventure:
  sms:
    enabled: false
